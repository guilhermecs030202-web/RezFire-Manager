<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos · RezFire Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#f4efe8",
            sidebar: "#1a1412",
            accent: "#e85c2a",
          },
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <div class="app-shell" id="app-shell">
    <main class="app-main">
      <div class="page-toolbar">
        <div>
          <h1 class="page-title">PRODUTOS</h1>
          <p class="page-subtitle" id="produtos-count"></p>
        </div>
        <div class="flex items-center gap-3">
          <input id="busca" class="search-input" type="search" placeholder="Buscar SKU, nome..." />
          <button class="btn-primary" id="btn-novo" type="button">+ Novo</button>
        </div>
      </div>

      <section class="card table-wrap">
        <table class="products-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>PRODUTO</th>
              <th>CATEGORIA</th>
              <th>TIPO</th>
              <th>CUSTO</th>
              <th>PREÇO</th>
              <th>SITUAÇÃO</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="produtos-body"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal" id="form-produto">
      <div class="modal-header">
        <h2 id="modal-title">Novo produto</h2>
      </div>

      <!-- Abas de Navegação -->
      <div class="modal-tabs" role="tablist">
        <button type="button" class="modal-tab-btn is-active" id="tab-btn-geral" data-tab="geral" role="tab" aria-selected="true">
          Geral
        </button>
        <button type="button" class="modal-tab-btn" id="tab-btn-detalhes" data-tab="detalhes" role="tab" aria-selected="false">
          Detalhes <span class="modal-tab-badge">Extintor</span>
        </button>
      </div>

      <input type="hidden" id="id_produto" />

      <!-- Aba 1: Informações Gerais -->
      <div class="modal-tab-pane" id="tab-pane-geral" role="tabpanel">
        <div class="form-grid">
          <div class="form-field">
            <label for="sku">SKU</label>
            <input id="sku" name="sku" required maxlength="40" />
          </div>
          <div class="form-field">
            <label for="custo">Custo</label>
            <input id="custo" name="custo" type="number" min="0" step="0.01" required />
          </div>
          <div class="form-field">
            <label for="preco">Preço</label>
            <input id="preco" name="preco" type="number" min="0" step="0.01" required />
          </div>
          <div class="form-field span-2">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" required maxlength="120" />
          </div>
          <div class="form-field span-2">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3" maxlength="500"></textarea>
          </div>
          <div class="form-field">
            <label for="categoria">Categoria</label>
            <input id="categoria" name="categoria" required maxlength="60" />
          </div>
          <div class="form-field">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo">
              <option value="Simples">Simples</option>
              <option value="Combo">Combo</option>
            </select>
          </div>
          <div class="form-field">
            <label for="ativo">Situação</label>
            <select id="ativo" name="ativo">
              <option value="true">Ativo</option>
              <option value="false">Inativo</option>
            </select>
          </div>
          <div id="combo-section" class="form-field span-2" style="display: none;">
            <label>Itens do Combo</label>
            <div class="flex gap-2 mb-2">
              <select id="combo-item-select" class="flex-1" style="padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.25rem;">
                <option value="">Selecione um produto simples...</option>
              </select>
              <input id="combo-item-qtd" type="number" min="1" step="1" value="1" style="width: 5rem; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.25rem;" />
              <button type="button" id="btn-add-combo-item" class="btn-ghost" style="padding: 0.5rem 1rem;">Adicionar</button>
            </div>
            <ul id="combo-items-list" class="flex flex-col gap-2 mt-2 bg-white border border-gray-200 rounded p-2 min-h-[50px]">
              <!-- Combo items will be listed here -->
            </ul>
          </div>
        </div>
      </div>

      <!-- Aba 2: Detalhes do Extintor -->
      <div class="modal-tab-pane" id="tab-pane-detalhes" role="tabpanel" style="display: none;">
        <div class="modal-info-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div>
            <strong>Ficha Técnica do Extintor:</strong> Acrescente os dados técnicos de certificação e rastreabilidade para itens do tipo extintor.
          </div>
        </div>

        <div class="form-grid">
          <div class="form-field">
            <label for="registro_inmetro">Certificação / Registro Inmetro</label>
            <input id="registro_inmetro" name="registro_inmetro" maxlength="50" placeholder="Ex: 003180/2022" />
          </div>
          <div class="form-field">
            <label for="tipo_extintor">Tipo do Extintor</label>
            <select id="tipo_extintor" name="tipo_extintor">
              <option value="">Selecione o tipo...</option>
              <option value="Pó Químico ABC">Pó Químico ABC</option>
              <option value="Pó Químico BC">Pó Químico BC</option>
              <option value="Água Pressurizada (AP)">Água Pressurizada (AP)</option>
              <option value="Dióxido de Carbono (CO2)">Dióxido de Carbono (CO2)</option>
              <option value="Espuma Mecânica">Espuma Mecânica</option>
              <option value="Classe K (Cozinhas)">Classe K (Cozinhas)</option>
              <option value="Halotron / Gases Limpos">Halotron / Gases Limpos</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="form-field">
            <label for="capacidade_peso">Capacidade Extintora / Peso</label>
            <input id="capacidade_peso" name="capacidade_peso" maxlength="50" placeholder="Ex: 4 kg (2-A:20-B:C) ou 10L" />
          </div>
          <div class="form-field">
            <label for="classe_incendio">Classe de Incêndio (A, B ou C)</label>
            <select id="classe_incendio" name="classe_incendio">
              <option value="">Selecione a classe...</option>
              <option value="ABC">Classe ABC (Múltiplo uso)</option>
              <option value="A">Classe A (Sólidos combustíveis)</option>
              <option value="BC">Classe BC (Líquidos e Elétricos)</option>
              <option value="B">Classe B (Líquidos inflamáveis)</option>
              <option value="C">Classe C (Equipamentos elétricos)</option>
              <option value="K">Classe K (Gorduras e óleos)</option>
              <option value="D">Classe D (Metais pirofóricos)</option>
            </select>
          </div>
          <div class="form-field span-2">
            <label for="fabricante">Fabricante</label>
            <input id="fabricante" name="fabricante" maxlength="100" placeholder="Ex: Resil, Kidde, Mocelin, Extang..." />
          </div>
          <div class="form-field">
            <label for="data_fabricacao">Data de Fabricação</label>
            <input id="data_fabricacao" name="data_fabricacao" type="date" />
          </div>
          <div class="form-field">
            <label for="data_validade">Data de Validade / Carga</label>
            <input id="data_validade" name="data_validade" type="date" />
          </div>
          <div class="form-field">
            <label for="numero_lacre">Número do Lacre</label>
            <input id="numero_lacre" name="numero_lacre" maxlength="50" placeholder="Ex: L-849201" />
          </div>
          <div class="form-field">
            <label for="selo_conformidade">Selo de Conformidade</label>
            <input id="selo_conformidade" name="selo_conformidade" maxlength="50" placeholder="Ex: INM-994120" />
          </div>
          <div class="form-field">
            <label for="id_lote">Identificador do Lote Padrão</label>
            <input id="id_lote" name="id_lote" maxlength="50" placeholder="Ex: LT-2024/07" />
          </div>
          <div class="form-field">
            <label for="peso_bruto_kg">Peso Bruto p/ Envio (kg)</label>
            <input id="peso_bruto_kg" name="peso_bruto_kg" type="number" step="0.01" min="0" placeholder="Ex: 6.50" />
          </div>
          <div class="form-field span-2">
            <label for="dimensoes">Dimensões da Embalagem (C x L x A cm)</label>
            <input id="dimensoes" name="dimensoes" maxlength="50" placeholder="Ex: 55 x 20 x 20 cm" />
          </div>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>
      <div class="modal-actions">
        <button class="btn-ghost" type="button" id="btn-cancelar">Cancelar</button>
        <button class="btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Modal de Visualização de Detalhes do Produto -->
  <div class="modal-backdrop" id="modal-view">
    <div class="modal" style="width: min(720px, 100%);">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(232,92,42,0.1);color:var(--accent);display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <div>
            <h2 id="view-title" style="margin:0;font-size:1.15rem;font-weight:700">Detalhes do Produto</h2>
            <span id="view-sku-badge" style="font-size:0.75rem;color:var(--muted);font-family:monospace">SKU: —</span>
          </div>
        </div>
        <button class="icon-btn" type="button" id="btn-close-view" title="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div id="view-content" style="padding-top:10px">
        <!-- Preenchido dinamicamente via JS -->
      </div>

      <div class="modal-actions" style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px">
        <button class="btn-ghost" type="button" id="btn-view-fechar">Fechar</button>
        <button class="btn-primary" type="button" id="btn-view-editar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          Editar Produto
        </button>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/produtos.js"></script>
</body>

</html>
